apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - apps/deployment-api.yml
  - apps/deployment-vlm.yml
  - apps/redis-deployment.yml
  - apps/keda-scaler.yml
  - networking/service.yml

# Labels for resource grouping
labels:
  - includeSelectors: true
    pairs:
      managed-by: tnm-deployment-agent
      system: aks-ocr-glmocr

# Define Variables in a ConfigMap (Shared by Worker and vLLM)
configMapGenerator:
  - name: ocr-pipeline-config
    literals:
      # --- Global Config ---
      - REDIS_HOST=ocr-redis-service
      - VLLM_URL=http://ocr-vlm-service:8000/v1/chat/completions
      # --- Worker Config ---
      - MAX_BATCH_SIZE=8
      - BATCH_WINDOW_MS=150
      - GLMOCR_CONFIG_PATH=/app/config.yaml
      - GLMOCR_PIPELINE_OCR_API_API_HOST=ocr-vlm-service
      - GLMOCR_PIPELINE_OCR_API_API_PORT=8000
      # --- vLLM Server Config ---
      - SERVED_NAME=Qwen/Qwen3.5-2B
      - PORT=8000
      - GPU_MEMORY=0.9
      - MAX_MODEL_LEN=16384
      - MAX_NUM_BATCHED_TOKENS=262144
      - MAX_NUM_SEQS=512
