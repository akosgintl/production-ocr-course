apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - apps/deployment-vlm.yml
  - apps/keda-scaler.yml
  - networking/service.yml

# Labels for resource grouping
labels:
  - includeSelectors: true
    pairs:
      managed-by: tnm-deployment-agent
      system: aks-ocr-dotsmocr

# Define Variables in a ConfigMap (Shared by vLLM Server)
configMapGenerator:
  - name: ocr-pipeline-config
    literals:
      # --- vLLM Single-Step VLM Server Config ---
      - SERVED_NAME=model
      - MODEL_ID=rednote-hilab/dots.mocr
      - PORT=8000
      - GPU_MEMORY=0.9
      - MAX_MODEL_LEN=16384
      - MAX_NUM_BATCHED_TOKENS=262144
      - MAX_NUM_SEQS=256
