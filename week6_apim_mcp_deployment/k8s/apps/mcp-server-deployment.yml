apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr-mcp-deployment
  labels:
    app: ocr-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ocr-mcp-server
  template:
    metadata:
      labels:
        app: ocr-mcp-server
    spec:
      containers:
        - name: ocr-mcp-server
          image: acrtnmweek3.azurecr.io/ocr-mcp-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: sse
          env:
            - name: MCP_TRANSPORT
              value: "sse"
            - name: PORT
              value: "8000"
            - name: OCR_API_URL
              value: "http://ocr-api-service:80"
          resources:
            limits:
              cpu: "1000m"
              memory: "1Gi"
            requests:
              cpu: "100m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: ocr-mcp-service
  namespace: default
spec:
  selector:
    app: ocr-mcp-server
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
