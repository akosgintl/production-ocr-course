apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr-gateway-deployment
  labels:
    app: ocr-gateway
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ocr-gateway
  template:
    metadata:
      labels:
        app: ocr-gateway
    spec:
      nodeSelector:
        kubernetes.azure.com/agentpool: cpunp
      tolerations:
        - key: "sku"
          operator: "Equal"
          value: "cpunp"
          effect: "NoSchedule"
      containers:
        - name: ocr-gateway
          image: acrtnmweek3.azurecr.io/ocr-gateway:latest
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "3000"
            - name: VLLM_BASE_URL
              value: "http://ocr-vlm-service:8000"
            - name: MODEL_ID
              value: "baidu/Unlimited-OCR"
            - name: PDF_MAX_SIZE
              value: "40"
            - name: DEFAULT_BATCH_SIZE
              value: "4"
            - name: RUST_LOG
              value: "info,tower_http=info"
          ports:
            - containerPort: 3000
              name: http
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            requests:
              cpu: "2"
              memory: "2Gi"
            limits:
              cpu: "8"
              memory: "8Gi"
